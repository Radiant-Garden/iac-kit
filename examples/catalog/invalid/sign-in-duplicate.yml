# An environment named "local" collides with the <app>-local registration.
# expect-output: sign_in
# expect-error: sign-in registration names must be unique: wiki-local (wiki, wiki)
# schema: valid
schema: 1
site:
  domains: { services: svc.example.org }
  environments: [prod, local]
apps:
  wiki:
    ports: [tcp/443]
    access: [staff]
    sign_in: { redirect_paths: [/], local: "http://localhost:8080" }
    instances:
      wiki-01-local: { host: apps-01 }
