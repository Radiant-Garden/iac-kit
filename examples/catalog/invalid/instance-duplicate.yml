# An instance name can only be well-formed for one app, so a duplicate also
# breaks the name rule in the other app; both messages appear.
# expect-output: instances
# expect-error: instance names must be unique across apps: wiki-01-prod (docs, wiki)
# schema: valid
schema: 1
site:
  domains: { services: svc.example.org }
  environments: [prod]
apps:
  wiki:
    ports: [tcp/443]
    access: [staff]
    instances:
      wiki-01-prod: { host: apps-01 }
  docs:
    ports: [tcp/443]
    access: [staff]
    instances:
      wiki-01-prod: { host: apps-02 }
