# yaml-language-server: $schema=../../schema/catalog.v1.schema.json
#
# Example catalog. Invented: example.org / example.com names and RFC 5737
# addresses only. expected.json is the module's output for this file, written
# by hand from the rules in tofu/modules/catalog/README.md.
schema: 1

site:
  domains: { services: svc.example.org }
  environments: [prod, staging, dev]
  dns: { provider: netbird-zone, distribution_groups: [staff] }
  acme: { provider: hetzner, challenge_zone: acme.example.com }
  allow_from: [100.64.0.0/10]
  identity: { provider: entra, role_namespace: https://example.org/apps }

# This repository's own rules, checked like the kit's. Outside prod an alias
# is <app>-<env>; prod aliases are free (wiki-next is the upgrade path).
conventions:
  alias_names:
    description: Outside prod an alias is <app>-<env>
    staging: "{app}-{env}"
    dev: "{app}-{env}"

apps:
  wiki:
    description: Team wiki
    ports: [tcp/443]
    access: [staff]
    sign_in:
      redirect_paths: [/oauth/callback]
      roles:
        wiki.reader: Reads pages
        wiki.editor: Edits pages
      local: http://localhost:8080
    instances:
      wiki-01-prod:
        host: apps-01
        upstream: wiki:8080
        compose_project: wiki          # pinned: an existing project keeps its name
      wiki-02-prod:                    # the upgrade path: second instance, same host
        host: apps-01
        upstream: wiki:8080
      wiki-01-dev:
        host: apps-02
        upstream: 127.0.0.1:3000
    aliases:
      wiki: wiki-01-prod
      wiki-next: wiki-02-prod
      wiki-dev: wiki-01-dev

  tracker:
    description: Issue tracker
    ports: [tcp/443]
    access: [staff, contractors]
    role: issue_tracker
    sign_in:
      redirect_paths: [/auth/callback, /]
      refresh_tokens: true
      id_token_claims: [auth_time, login_hint]
    instances:
      tracker-01-staging:
        host: apps-02
        upstream: unix//run/tracker/http.sock
        networks: [edge]
    aliases:
      tracker-staging: tracker-01-staging

  metrics:                             # no upstream: NetBird only, no Caddy
    ports: [tcp/9100]
    access: [monitoring]
    instances:
      metrics-01-prod:
        host: apps-01

  resolver:
    description: Internal DNS resolver
    ports: [tcp/53, udp/53, tcp/853]
    access: [All]
    size: { cores: 1, memory: 1024, disk: 8 }
    instances:
      resolver-01-prod:
        guest: { platform: proxmox-lxc, node: pve-01, vm_id: 201, ip: 192.0.2.11 }
      resolver-02-prod:
        upstream: 127.0.0.1:8053
        guest: { platform: proxmox-lxc, node: pve-02, vm_id: 202, ip: 192.0.2.12 }
    aliases:
      resolver: resolver-01-prod
